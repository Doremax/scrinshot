<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Скан рецепта</title>
<style>
  body { font-family: sans-serif; padding: 12px; }
  label { display: block; font-size: 12px; color: #666; margin-top: 8px; }
  input:not([type=file]) { width: 100%; padding: 8px; box-sizing: border-box; }
  button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; }

  #cam { display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100dvh;
         background: #000; z-index: 10; overflow: hidden; }
  #v { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #frame { position: absolute; left: 4vw; width: 92vw; aspect-ratio: 1870 / 888;
           top: 50%; transform: translateY(-50%); border: 3px solid #2ecc71;
           box-sizing: border-box; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); pointer-events: none; }
  #hint { position: absolute; top: 10px; left: 0; right: 0; text-align: center;
          color: #fff; font-size: 14px; padding: 0 16px; pointer-events: none; }
  #info { position: absolute; top: 62px; left: 0; right: 0; text-align: center;
          color: #ff0; font-size: 12px; pointer-events: none; }
  #camBtns { position: absolute; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center;
             bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }
  #camBtns button { margin: 0; padding: 12px 6px; font-size: 15px; }
  #shotBtn { width: 78px; height: 78px; flex: 0 0 78px; border-radius: 50%; border: 5px solid #fff;
             background: #2ecc71; padding: 0; font-size: 0; }
  #closeBtn, #fullBtn { flex: 1; }
</style>
</head>
<body>

<button id="camBtn">📷 Сделать фото рецепта</button>
<button id="galBtn" style="background:#eee">🖼 Выбрать из галереи</button>
<input type="file" id="f" accept="image/*" style="display:none">

<div id="form"></div>
<button id="saveBtn" style="display:none">Сохранить</button>

<div id="cam">
  <video id="v" autoplay playsinline muted></video>
  <div id="frame"></div>
  <div id="hint">Вместите экран с рецептом в зелёную рамку.<br>Можно снимать вертикально или горизонтально.</div>
  <div id="info"></div>
  <div id="camBtns">
    <button id="closeBtn">Отмена</button>
    <button id="shotBtn" aria-label="Снять">●</button>
    <button id="fullBtn">Весь кадр</button>
  </div>
</div>

<script>
const URL_GAS = 'https://script.google.com/macros/s/AKfycbzo-urWqUISguN-1IW9NiAFVpiK79sN4l8t_1J6-MJ3K-HvJHoLgIdbJEa1XGAXkLZahg/exec';
const RW = 1870, RH = 888, MAX_W = 2200;
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
let current = null, stream = null;

const post = o => fetch(URL_GAS, { method: 'POST', body: JSON.stringify(o) }).then(r => r.json());

// ---------- Камера ----------
function fit() { cam.style.height = window.innerHeight + 'px'; }
window.addEventListener('resize', fit);

async function getStream() {
  const tries = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: 'environment' }, audio: false },
    { video: true, audio: false }
  ];
  let last;
  for (const c of tries) {
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch (e) { last = e; if (e.name === 'NotAllowedError') break; }
  }
  throw last;
}

camBtn.onclick = async () => {
  cam.style.display = 'block'; fit();
  info.textContent = 'Запуск камеры...';
  try {
    stream = await getStream();
    v.srcObject = stream;
    v.muted = true;
    await v.play();
  } catch (e) {
    closeCam();
    alert('Камера недоступна: ' + e.name + '. Разрешите доступ к камере для Telegram или выберите фото из галереи.');
    return;
  }
  const upd = () => { info.textContent = v.videoWidth ? ('Камера: ' + v.videoWidth + '×' + v.videoHeight) : ''; };
  v.onloadedmetadata = upd; upd();
  setTimeout(() => {
    if (stream && !v.videoWidth) info.textContent = 'Нет изображения с камеры. Закройте другие приложения, которые используют камеру.';
    else upd();
  }, 1500);
};

function closeCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; v.srcObject = null; cam.style.display = 'none';
}
closeBtn.onclick = closeCam;

function capture(useFrame) {
  const vW = v.videoWidth, vH = v.videoHeight;
  if (!vW) { alert('Камера ещё не готова. Подождите секунду.'); return; }
  let sx = 0, sy = 0, sw = vW, sh = vH, ow, oh;

  if (useFrame) {
    const vb = v.getBoundingClientRect(), fr = frame.getBoundingClientRect();
    const scale = Math.max(vb.width / vW, vb.height / vH);          // object-fit: cover
    const ox = (vW * scale - vb.width) / 2, oy = (vH * scale - vb.height) / 2;
    sx = Math.max(0, (fr.left - vb.left + ox) / scale);
    sy = Math.max(0, (fr.top - vb.top + oy) / scale);
    sw = Math.min(vW - sx, fr.width / scale);
    sh = Math.min(vH - sy, fr.height / scale);
  }
  ow = Math.min(Math.round(sw), MAX_W);
  oh = Math.round(ow * sh / sw);

  const c = document.createElement('canvas'); c.width = ow; c.height = oh;
  c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, ow, oh);
  closeCam();
  runScan(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
}
shotBtn.onclick = () => capture(true);
fullBtn.onclick = () => capture(false);

// ---------- Галерея ----------
galBtn.onclick = () => f.click();
f.onchange = () => {
  const file = f.files[0]; if (!file) return;
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, MAX_W / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    f.value = '';
    runScan(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
  };
  img.src = URL.createObjectURL(file);
};

// ---------- Распознавание ----------
async function runScan(b64) {
  saveBtn.style.display = 'none';
  form.textContent = 'Распознаю...';
  try {
    const r = await post({ action: 'scan', image: b64, mime: 'image/jpeg' });
    if (!r.ok) throw new Error(r.error);
    const d = current = r.data;
    const warn = d._valid ? '' :
      '<b style="color:red">№ рецепта или код защиты распознан неточно — проверьте или переснимите</b>';
    form.innerHTML = warn + Object.entries(d).filter(([k]) => k[0] !== '_').map(([k, val]) =>
      `<label>${k}<input data-k="${k}" value="${val == null ? '' : String(val).replace(/"/g, '&quot;')}"></label>`
    ).join('');
    saveBtn.style.display = '';
  } catch (e) { form.textContent = 'Ошибка: ' + e.message; }
}

// ---------- Сохранение ----------
saveBtn.onclick = async () => {
  form.querySelectorAll('input').forEach(i => current[i.dataset.k] = i.value);
  const uid = tg?.initDataUnsafe?.user?.id || '';
  try {
    const r = await post({ action: 'save', data: current, user: uid });
    alert(r.ok ? 'Сохранено ✅' : r.error);
    if (r.ok) { form.innerHTML = ''; saveBtn.style.display = 'none'; }
  } catch (e) { alert('Ошибка: ' + e.message); }
};
</script>
</body>
</html>
